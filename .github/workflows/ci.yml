name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate dotfiles
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh yadm vim python3-venv

      - name: Install validation dependencies
        run: bash scripts/setup-checks.sh

      - name: Run local checks
        run: ./scripts/check.sh

      - name: Render yadm alternates in a temporary home
        run: |
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT

          HOME="$temp_home" yadm clone --no-bootstrap "$GITHUB_WORKSPACE"
          HOME="$temp_home" yadm config local.class personal
          HOME="$temp_home" yadm alt --force

          HOME="$temp_home" python3 "$temp_home/scripts/migrate-zsh-layout.py" --apply
          test -L "$temp_home/.zshrc_custom"
          test -f "$temp_home/.vim/vimrc"
          test -f "$temp_home/.Brewfile"
          test -e "$temp_home/.config/git/local.conf"
          test -e "$temp_home/.config/git/platform.conf"
          HOME="$temp_home" git config --global --includes --get user.name > /dev/null
          HOME="$temp_home" git config --global --includes --get alias.st | grep -qx status
