interface:
  display_name: "Poke Notify"
  short_description: "Poke webhook backend for $notify-user (enabled by default; missing POKE_API_KEY soft-skips)."
  icon_small: "./assets/poke-notify-icon.svg"
  icon_large: "./assets/poke-notify-icon.png"
  brand_color: "#DB2777"
  default_prompt: "Do not use $poke-notify for routine handoffs. Load $notify-user instead. Use this provider skill only when repairing the Poke webhook helper or when the user explicitly asked for Poke."

policy:
  allow_implicit_invocation: false
