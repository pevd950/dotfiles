# Drop into a job right after actions/checkout. The job (or workflow) must declare `environment: ci`
# (or `production`), where OP_SERVICE_ACCOUNT_TOKEN is the only GitHub secret. Replace the references.
# The secrets come back as step outputs; map each one only into the steps that call the provider.
# Never `export-env: true`: that hands every key to unrelated steps such as dependency installs.
      - name: Load secrets from 1Password
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: false
          version: 2.41.0  # pin the CLI; "latest" would let a new release change the job silently
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://PROJECT Dev/OpenAI PROJECT-CI/credential
          ANTHROPIC_API_KEY: op://PROJECT Dev/Anthropic PROJECT-ci/credential
      # Then, in each step that needs a key:
      #   env:
      #     OPENAI_API_KEY: ${{ steps.op.outputs.OPENAI_API_KEY }}
      #     ANTHROPIC_API_KEY: ${{ steps.op.outputs.ANTHROPIC_API_KEY }}
