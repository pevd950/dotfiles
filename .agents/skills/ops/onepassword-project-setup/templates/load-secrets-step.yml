# Drop into a job right after actions/checkout. The job (or workflow) must declare `environment: ci`
# (or `production`), where OP_SERVICE_ACCOUNT_TOKEN is the only GitHub secret. Replace the references.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://PROJECT Dev/OpenAI PROJECT-CI/credential
          ANTHROPIC_API_KEY: op://PROJECT Dev/Anthropic PROJECT-ci/credential
