# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Use custom format
#format = """
#[┌───────────────────>](bold green)
#[│](bold green) $hostname$directory$rust$package: $git_branch$git_status$kubernetes$fill$azure
#[└─> ](bold green)"""

#format = """
#$username\
#$hostname\
#$localip\
#$kubernetes\
#$helm\
#$directory\
#$git_branch\
#$git_commit\
#$git_state\
#$git_metrics\
#$git_status\
#$azure\
#"""

# Inserts a blank line between shell prompts
add_newline = false

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[➜](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

# Utils

[docker_context]
disabled = true

[azure]
disabled = true

# [kubernetes]
# format ='[- $symbol($cluster in )$context \($namespace\)](green) '
# disabled = false
# detect_files = ['k8s']
# detect_folders = ['ghae-kube', '!~/Developer', '!']

[fill]
symbol = ' '

[nodejs]
disabled = true
detect_folders = ["!Developer"]

[hostname]
ssh_symbol="🌐"
format='[$ssh_symbol$hostname ](bold red)'

# [git_status]

[custom.yadm]
# Keep prompt evaluation read-only: yadm status can run auto-alt/auto-perms.
# Show tracked filenames and status; skip untracked files and submodule inspection.
command = '''
repo=$(yadm introspect repo 2>/dev/null) || exit 0
git --no-optional-locks --git-dir="$repo" --work-tree="$HOME" status --porcelain=v1 --untracked-files=no --ignore-submodules=all 2>/dev/null |
  awk '{ status = substr($0, 1, 2); gsub(/ /, "", status); printf "%s%s %s", (NR > 1 ? ", " : ""), status, substr($0, 4) }'
'''
when = '[ "$PWD" = "$HOME" ] && command -v yadm >/dev/null 2>&1'
shell = ["sh"]
format = "([yadm:$output](bold yellow) )"
disabled = false
